name: Deploy CAW to Hetzner

# Deploy only a successful *push to main* CI result. A manual rerun must
# target main and prove that the very same commit passed the validate check.
on:
  workflow_run:
    workflows: ["C++ build and Compose smoke"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: caw-hetzner-production
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      vars.CAW_PRODUCTION_APPROVED == 'true' &&
      (
        (github.event_name == 'workflow_run' &&
         vars.CAW_AUTO_DEPLOY == 'true' &&
         github.event.workflow_run.conclusion == 'success' &&
         github.event.workflow_run.event == 'push' &&
         github.event.workflow_run.head_branch == 'main' &&
         github.event.workflow_run.head_repository.full_name == github.repository) ||
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      checks: read
      packages: write
    env:
      DEPLOY_SHA: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      tag: ${{ steps.commit.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}
          persist-credentials: false
      - name: Verify that this exact commit passed CI on main
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$DEPLOY_SHA" = "$(git rev-parse HEAD)"
          case "$DEPLOY_SHA" in
            *[!0-9a-f]*|'') echo "Invalid commit SHA"; exit 1 ;;
          esac
          test "${#DEPLOY_SHA}" -eq 40
          result="$(gh api "repos/$GITHUB_REPOSITORY/compare/$DEPLOY_SHA...main" --jq .status)"
          case "$result" in
            identical|ahead) ;;
            *) echo "Commit is no longer on main"; exit 1 ;;
          esac
          passed="$(gh api "repos/$GITHUB_REPOSITORY/commits/$DEPLOY_SHA/check-runs" \
            --jq '[.check_runs[] | select(.name == "validate" and .conclusion == "success")] | length')"
          test "$passed" -ge 1 || { echo "The commit has no successful CI validate check"; exit 1; }
          echo "sha=$DEPLOY_SHA" >> "$GITHUB_OUTPUT"
          echo "tag=sha-$DEPLOY_SHA" >> "$GITHUB_OUTPUT"
      - name: Build and publish an immutable GHCR image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          image="ghcr.io/0b-ivan/caw-server:sha-$DEPLOY_SHA"
          echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker build --target runtime -t "$image" -f deploy/server.Dockerfile .
          docker push "$image"

  deploy:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_SHA: ${{ needs.publish.outputs.sha }}
      DEPLOY_TAG: ${{ needs.publish.outputs.tag }}
      CAW_SSH_HOST: ${{ secrets.CAW_SSH_HOST }}
      CAW_SSH_USER: ${{ secrets.CAW_SSH_USER }}
      CAW_SSH_KEY: ${{ secrets.CAW_SSH_PRIVATE_KEY }}
      CAW_SSH_KNOWN_HOSTS: ${{ secrets.CAW_SSH_KNOWN_HOSTS }}
      CAW_SSH_PORT: ${{ vars.CAW_SSH_PORT || '22' }}
      GHCR_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}
          persist-credentials: false
      - name: Authenticate to the existing Hetzner host
        run: |
          set -euo pipefail
          test -n "$CAW_SSH_HOST" && test -n "$CAW_SSH_USER"
          test -n "$CAW_SSH_KEY" && test -n "$CAW_SSH_KNOWN_HOSTS"
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$CAW_SSH_KEY" > "$HOME/.ssh/caw_deploy"
          printf '%s\n' "$CAW_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/caw_deploy" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/caw_deploy" >/dev/null
      - name: Back up and update only the CAW Compose services
        run: |
          set -euo pipefail
          # The short-lived GHCR token is sent only as SSH stdin; no persistent
          # server-side Docker login, credentials file, or command-line secret.
          printf '%s\n' "$GHCR_TOKEN" |
            ssh -T -i "$HOME/.ssh/caw_deploy" \
              -p "$CAW_SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes \
              "$CAW_SSH_USER@$CAW_SSH_HOST" \
              "cd /opt/caw && bash bin/deploy-hetzner '$DEPLOY_TAG' '$GITHUB_ACTOR'"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify the public HTTPS and WebSocket handshake
        id: wss
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if node bin/hetzner-wss-check.mjs; then
              exit 0
            fi
            echo "WSS probe attempt $attempt failed"
            sleep 5
          done
          exit 1
      - name: Roll back CAW if the public WebSocket handshake fails
        if: failure() && steps.wss.outcome == 'failure'
        run: |
          set -euo pipefail
          ssh -T -i "$HOME/.ssh/caw_deploy" \
            -p "$CAW_SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$CAW_SSH_USER@$CAW_SSH_HOST" \
            "cd /opt/caw && bash bin/rollback-hetzner '$DEPLOY_SHA'"
