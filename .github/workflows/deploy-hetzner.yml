name: Deploy CAW to Hetzner

# Push starts the gate, but no image is published until that exact main push
# completes its full CI successfully. Manual dispatch uses the same gate.
on:
  push:
    branches: [main]
  workflow_dispatch:
  # Retry deferred releases while existing games are in progress.
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: read

concurrency:
  group: caw-hetzner-production
  cancel-in-progress: false

jobs:
  publish:
    # Operator explicitly enabled automatic deployments from tested main pushes.
    # The production environment, exact-SHA CI gate and rollback stay mandatory.
    if: >-
      github.repository == '0b-ivan/CAW' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event_name == 'push' ||
       github.event_name == 'schedule')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      packages: write
    env:
      DEPLOY_SHA: ${{ github.sha }}
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      tag: ${{ steps.commit.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}
          persist-credentials: false
      - name: Verify that this exact commit passed CI on main
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$DEPLOY_SHA" = "$(git rev-parse HEAD)"
          bash bin/verify-main-ci "$DEPLOY_SHA"
          echo "sha=$DEPLOY_SHA" >> "$GITHUB_OUTPUT"
          echo "tag=sha-$DEPLOY_SHA" >> "$GITHUB_OUTPUT"
      - name: Build and publish an immutable GHCR image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          image="ghcr.io/0b-ivan/caw-server:sha-$DEPLOY_SHA"
          echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          if docker manifest inspect "$image" >/dev/null 2>&1; then
            echo "PASS: immutable GHCR image already exists"
          else
            docker build --target runtime -t "$image" -f deploy/server.Dockerfile .
            docker push "$image"
          fi

  deploy:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      DEPLOY_SHA: ${{ needs.publish.outputs.sha }}
      DEPLOY_TAG: ${{ needs.publish.outputs.tag }}
      CAW_SSH_HOST: ${{ secrets.CAW_SSH_HOST }}
      CAW_SSH_USER: ${{ secrets.CAW_SSH_USER }}
      CAW_SSH_KEY: ${{ secrets.CAW_SSH_PRIVATE_KEY }}
      CAW_SSH_KNOWN_HOSTS: ${{ secrets.CAW_SSH_KNOWN_HOSTS }}
      CAW_SSH_PORT: ${{ vars.CAW_SSH_PORT || '22' }}
      GHCR_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}
          persist-credentials: false
      - name: Authenticate to the existing Hetzner host
        run: |
          set -euo pipefail
          test -n "$CAW_SSH_HOST" && test -n "$CAW_SSH_USER"
          test -n "$CAW_SSH_KEY" && test -n "$CAW_SSH_KNOWN_HOSTS"
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$CAW_SSH_KEY" > "$HOME/.ssh/caw_deploy"
          printf '%s\n' "$CAW_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/caw_deploy" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/caw_deploy" >/dev/null
      - name: Deploy only when no CAW games or sockets are active
        id: rollout
        run: |
          set -euo pipefail
          # The old production checkout does not yet have bin/deploy-hetzner.
          # Read the tested script from Git without changing tracked files.
          # GHCR_TOKEN remains on stdin, never in the host filesystem.
          set +e
          printf '%s\n' "$GHCR_TOKEN" |
            ssh -T -i "$HOME/.ssh/caw_deploy" \
              -p "$CAW_SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes \
              "$CAW_SSH_USER@$CAW_SSH_HOST" \
              "set -e; cd /opt/caw; git fetch --quiet origin main; bootstrap=\$(mktemp .git/caw-deploy-bootstrap.XXXXXX); trap 'rm -f \"\$bootstrap\"' EXIT; git show '$DEPLOY_SHA:bin/deploy-hetzner' > \"\$bootstrap\"; bash \"\$bootstrap\" '$DEPLOY_TAG' '$GITHUB_ACTOR'"
          result=$?
          set -e
          if [[ "$result" == 75 ]]; then
            echo "deferred=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Active games detected: deployment postponed until a scheduled retry"
            exit 0
          fi
          exit "$result"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify the public HTTPS and WebSocket handshake
        id: wss
        if: steps.rollout.outputs.deferred != 'true'
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if node bin/hetzner-wss-check.mjs; then
              exit 0
            fi
            echo "WSS probe attempt $attempt failed"
            sleep 5
          done
          exit 1
      - name: Roll back CAW if the public WebSocket handshake fails
        if: failure() && steps.wss.outcome == 'failure'
        run: |
          set -euo pipefail
          ssh -T -i "$HOME/.ssh/caw_deploy" \
            -p "$CAW_SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$CAW_SSH_USER@$CAW_SSH_HOST" \
            "cd /opt/caw && bash bin/rollback-hetzner '$DEPLOY_SHA'"
