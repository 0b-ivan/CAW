name: C++ build and Compose smoke
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: caw-ci
      HTTP_PORT: "8080"
      HTTPS_PORT: "8443"
    steps:
      - uses: actions/checkout@v4
      - name: Create ephemeral test configuration
        run: echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)" > deploy/.env
      - name: Build C++20 and run CTest in Debian
        run: |
          docker build --target build -t caw-build -f deploy/server.Dockerfile .
          docker run --rm caw-build ctest --test-dir /app/build --output-on-failure
      - name: Check formatting and clang-tidy
        run: |
          docker run --rm caw-build ./bin/lint
      - name: Build runtime image and start Compose
        run: docker compose -f deploy/compose.yml up --build --detach --wait --wait-timeout 180
      - name: Probe Caddy and dependency outage recovery
        run: ./bin/smoke
      - name: Browser landing page
        run: |
          npm install --no-save --prefix /tmp/caw-browser playwright@1.56.1
          /tmp/caw-browser/node_modules/.bin/playwright install --with-deps chromium
          NODE_PATH=/tmp/caw-browser/node_modules node web/tests/landing.cjs
      - name: Compose diagnostics
        if: failure()
        run: docker compose -f deploy/compose.yml logs --no-color
      - name: Clean up
        if: always()
        run: docker compose -f deploy/compose.yml down --volumes --remove-orphans
