name: C++ build and Compose smoke
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: caw-ci
      HTTP_PORT: "8080"
      HTTPS_PORT: "8443"
      # The tests open many sockets from one address; the limit itself is checked at the end.
      RATE_LIMIT_PER_MINUTE: "1000000"
    steps:
      - uses: actions/checkout@v4
      - name: Offline tests for external CSV download sources
        run: python3 -m unittest discover -s tests -p 'test_*cvh*.py'
      - name: Validate optional Prior99 converter without third-party cards
        run: python3 -m unittest discover -s tests -p 'test_prior99_importer.py'
      - name: Audit imported Prior99 deck and attribution
        run: python3 -m unittest discover -s tests -p 'test_vendored_prior99_pack.py'
      - name: Create ephemeral test configuration
        run: echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)" > deploy/.env
      - name: Validate existing-Tunnel Compose and Caddy origin
        run: |
          python3 -m unittest discover -s tests -p 'test_hetzner_preflight.py'
          python3 -m unittest discover -s tests -p 'test_hetzner_deploy.py'
          python3 -m unittest discover -s tests -p 'test_legacy_room_idle.py'
          python3 -m unittest discover -s tests -p 'test_local_restore.py'
          python3 -m unittest discover -s tests -p 'test_release_candidate.py'
          docker compose -f deploy/compose.yml -f deploy/compose.hetzner.yml config --format json | python3 -c '
          import json, sys
          model = json.load(sys.stdin)
          services = model["services"]
          ports = services["caddy"]["ports"]
          assert len(ports) == 1, ports
          assert ports[0]["host_ip"] == "127.0.0.1", ports
          assert str(ports[0]["published"]) == "18081", ports
          assert ports[0]["target"] == 80, ports
          assert "cloudflared" not in services, "existing host Tunnel must be reused"
          assert not services["server"].get("ports")
          assert not services["redis"].get("ports")
          assert not services["postgres"].get("ports")
          print("PASS Hetzner: existing Tunnel, loopback-only CAW origin")
          '
          docker run --rm --entrypoint caddy \
            -v "$PWD/deploy/Caddyfile.hetzner:/etc/caddy/Caddyfile:ro" \
            caddy:2.11.2-alpine validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Validate GitHub Actions workflows with actionlint
        run: |
          # Validate workflow structure and expressions, not only shell syntax.
          docker run --rm -v "$PWD:/repo:ro" -w /repo rhysd/actionlint:1.7.12 \
            -shellcheck= -pyflakes= .github/workflows/ci.yml .github/workflows/deploy-hetzner.yml .github/workflows/hetzner-ssh-preflight.yml .github/workflows/release-candidate.yml
      - name: Build C++20 and run CTest in Debian
        run: |
          docker build --target build -t caw-build -f deploy/server.Dockerfile .
          docker run --rm caw-build ctest --test-dir /app/build --output-on-failure
      - name: Check formatting and clang-tidy
        run: |
          docker run --rm caw-build ./bin/lint
      - name: Build runtime image and start Compose
        run: docker compose -f deploy/compose.yml up --build --detach --wait --wait-timeout 180
      - name: Probe Caddy and dependency outage recovery
        run: ./bin/smoke
      - name: The image loads seven credited card packs, including opt-in Prior99
        run: |
          curl --fail --silent http://localhost:8080/api/packs | python3 -c '
          import json, sys
          packs = json.load(sys.stdin)["packs"]
          assert len(packs) == 7, packs
          original = [p for p in packs if p["id"].startswith("cvh-")]
          assert len(original) == 6
          assert sum(p["prompts"] for p in original) == 585
          assert sum(p["answers"] for p in original) == 1179
          assert all(p["license"] == "CC BY-NC-SA 2.0" and p["rightsHolder"] for p in original)
          prior99 = next(p for p in packs if p["id"] == "prior99-fullformat-german")
          assert prior99["prompts"] == 107 and prior99["answers"] == 610, prior99
          assert prior99["rightsHolder"] and prior99["sourceUrl"] and prior99["license"]
          print("PASS seven packs: 692 prompts, 1789 answers; Prior99 credited")'
      # Node 22 brings a built-in WebSocket client; the bots need no npm packages.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check live WSS probe syntax (no external connection)
        run: node --check bin/hetzner-wss-check.mjs
      - name: QR encoder against the firmware library's codes
        run: node web/tests/qr.mjs
      - name: Eight bots play a match with a reload storm and a server restart
        run: node tests/bots/play.mjs http://localhost:8080 "docker compose -f deploy/compose.yml restart server"
      - name: "Browser: landing page and a full match on four phones"
        run: |
          npm install --no-save --prefix /tmp/caw-browser playwright@1.56.1
          /tmp/caw-browser/node_modules/.bin/playwright install --with-deps chromium
          CAW_SCREENSHOT_DIR=/tmp/caw-ui NODE_PATH=/tmp/caw-browser/node_modules node web/tests/landing.cjs
          CAW_SCREENSHOT_DIR=/tmp/caw-ui CAW_EXPECT_FAME=1 NODE_PATH=/tmp/caw-browser/node_modules node web/tests/play.cjs
      - name: Upload UI screenshots for PR review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: caw-ui-screenshots
          path: /tmp/caw-ui
          if-no-files-found: ignore
      - name: "Load: 1000 rooms × 8 players + host + big screen against the budgets"
        run: node tests/load/load.mjs http://localhost:8080 1000 3
      - name: The rate limit answers 429 to a flood from one address
        run: |
          RATE_LIMIT_PER_MINUTE=60 docker compose -f deploy/compose.yml up --detach --wait server
          codes=$(for i in $(seq 1 60); do curl -s -o /dev/null -w '%{http_code}\n' http://localhost:8080/api/sessions/ZZZZZZ; done | sort | uniq -c)
          echo "$codes"
          echo "$codes" | grep -q ' 429$'
      - name: Back up the statistics and restore them into a fresh database
        run: |
          compose="docker compose -f deploy/compose.yml"
          $compose exec -T backup /bin/sh /backup.sh once
          dump=$($compose exec -T backup ls /backups | grep '^caw-' | sort | tail -1)
          ./bin/restore "$dump" caw_check
          count() { $compose exec -T postgres psql -U caw -d "$1" -tAc 'SELECT count(*) FROM players'; }
          echo "players: original $(count caw), restored $(count caw_check)"
          test "$(count caw)" -gt 0
          test "$(count caw)" = "$(count caw_check)"
      - name: Restore local backup in a disposable network-isolated PostgreSQL
        run: CAW_RESTORE_PROJECT=caw-ci bash bin/verify-local-restore
      - name: Monitoring configuration is valid
        run: |
          docker run --rm -v "$PWD/deploy/monitoring:/etc/prometheus:ro" --entrypoint promtool \
            prom/prometheus:v3.5.0 check config /etc/prometheus/prometheus.yml
      - name: Compose diagnostics
        if: failure()
        run: docker compose -f deploy/compose.yml logs --no-color
      - name: Clean up
        if: always()
        run: docker compose -f deploy/compose.yml down --volumes --remove-orphans
