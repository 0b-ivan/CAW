name: Vendor licensed Cards vs Humanity originals
on:
  push:
    branches: [feat/cvh-pack-sources-20261031]
    paths:
      - .github/workflows/vendor-cvh-source.yml
permissions:
  contents: write
jobs:
  vendor:
    if: github.repository == '0b-ivan/CAW' && github.ref == 'refs/heads/feat/cvh-pack-sources-20261031'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Fetch originals and verify exact source revision
        run: |
          python3 bin/fetch-cvh-sets.py
          destination=assets/cardpacks/cards-vs-humanity
          cp local-cardpacks/cards-vs-humanity/*.csv "$destination/"
          cd "$destination"
          sha256sum --check SHA256SUMS
      - name: Commit unchanged original CSVs on this feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- assets/cardpacks/cards-vs-humanity/*.csv
          if git diff --cached --quiet; then
            echo "Original CSV files already versioned"
          else
            git commit -m "feat: vendor six attributed CC-licensed CVH source decks"
            git push origin "HEAD:refs/heads/feat/cvh-pack-sources-20261031"
          fi
