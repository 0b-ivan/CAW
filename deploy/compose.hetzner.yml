# Use the EXISTING cloudflared systemd service on the Hetzner host.
# Caddy is reachable only from the host over loopback; no new Tunnel container.
# Requires Docker Compose 2.24.4+ (!override).
services:
  caddy:
    ports: !override
      - "127.0.0.1:${CAW_ORIGIN_PORT:-18081}:80"
    environment:
      CADDY_ADDRESS: ":80"
    volumes:
      - ./Caddyfile.hetzner:/etc/caddy/Caddyfile:ro
  server:
    environment:
      PUBLIC_URL: https://caw.obivan.org
